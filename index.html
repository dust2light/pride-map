<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>MapDate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">Map<span>Date</span></div>
        <div class="subtitle">Menschen in deiner Nähe</div>
      </div>
      <button id="locateBtn" class="icon-btn" aria-label="Standort verwenden">⌖</button>
    </header>

    <section class="map" id="map">
      <div class="map-grid"></div>
      <div class="map-label label-a">Innenstadt</div>
      <div class="map-label label-b">Park</div>
      <div class="map-label label-c">Bahnhof</div>
      <div id="userPin" class="user-pin" title="Du"></div>
      <div id="profilePins"></div>
      <div class="map-controls">
        <button id="zoomIn">+</button>
        <button id="zoomOut">−</button>
      </div>
      <div id="locationStatus" class="location-status">Demo-Karte · Standort wird nicht gespeichert</div>
    </section>

    <section class="discover">
      <div class="section-head">
        <div>
          <h1>In deiner Nähe</h1>
          <p id="countText">6 Profile · Demo</p>
        </div>
        <button id="filterBtn" class="filter-btn">Filter</button>
      </div>
      <div id="profiles" class="profiles"></div>
    </section>

    <nav class="nav">
      <button class="nav-item active" data-view="discover">⌖<span>Entdecken</span></button>
      <button class="nav-item" data-view="likes">♡<span>Likes</span></button>
      <button class="nav-item" data-view="chat">◌<span>Chats</span></button>
      <button class="nav-item" data-view="profile">◯<span>Profil</span></button>
    </nav>
  </main>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
